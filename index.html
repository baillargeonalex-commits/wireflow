<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CableTrack Pro</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#0a0c0f;--bg1:#0f1216;--bg2:#141820;--bg3:#1a2030;--bg4:#202838;
  --border:#253040;--border2:#2e3a4a;
  --text0:#e8eef5;--text1:#a8b8cc;--text2:#6a7d94;
  --acc:#00d4ff;
  --sched-bg:#2d3748;--sched-t:#94a3b8;
  --pull-bg:#92400e;--pull-t:#fbbf24;
  --term-bg:#7c2d12;--term-t:#fb923c;
  --test-bg:#14532d;--test-t:#4ade80;
  --font-mono:'JetBrains Mono',monospace;
  --font-head:'Rajdhani',sans-serif;
  --danger:#ef4444;--danger-bg:#2a0e0e;
}
html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--text0);font-family:var(--font-mono);font-size:13px}
#root{height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
button:focus,select:focus,input:focus,textarea:focus{outline:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:28px;width:100%;max-width:480px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.5;stroke-width:1.5px}50%{opacity:1;stroke-width:2.5px}}
.card-enter{animation:fadeUp .25s ease both}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--border2);border-radius:7px;padding:9px 16px;font-size:12px;animation:fadeUp .2s ease;pointer-events:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useCallback,useRef,useEffect,useMemo}=React;

/* ══════════ Constants ══════════ */
const STATUS_ORDER=['Scheduled','Pulled','Terminating','Tested'];
const STATUS_META={
  Scheduled:{bg:'var(--sched-bg)',text:'var(--sched-t)',dot:'#64748b',badge:'SCHED'},
  Pulled:   {bg:'var(--pull-bg)', text:'var(--pull-t)', dot:'#fbbf24',badge:'PULL'},
  Terminating:{bg:'var(--term-bg)',text:'var(--term-t)',dot:'#fb923c',badge:'TERM'},
  Tested:   {bg:'var(--test-bg)', text:'var(--test-t)', dot:'#4ade80',badge:'TEST'},
};
const EQ_ICON ={Switchgear:'⚡',Transformer:'↯',UPS:'🔋','Server Rack':'▦',PDU:'⊞',Panel:'▤',Generator:'⚙'};
const EQ_COLOR={Switchgear:'#0f2a4a',Transformer:'#1e1040',UPS:'#0d2a1e','Server Rack':'#1a1432',PDU:'#2a1e0e',Panel:'#0f1e2a',Generator:'#2a0e0e'};
const EQ_TYPES=['Switchgear','Transformer','UPS','Server Rack','PDU','Panel','Generator'];
const CARD_W=150,CARD_H=68;
const STORAGE_KEY='cabletrack_projects_v1';

/* ── Excel column headers (must match template) ── */
const EQ_COLS =['Equipment ID','Name','Type','Location'];
const CBL_COLS=['Cable Tag','Cable Type','From Equipment ID','To Equipment ID','Length (m)','Status'];

/* ══════════ LocalStorage helpers ══════════ */
function loadProjects(){
  try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):[];}
  catch{return[];}
}
function saveProjects(projects){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(projects));}catch{}
}

/* ══════════ Excel helpers ══════════ */
function pct(a,b){return b===0?'0%':Math.round(a/b*100)+'%'}

function applyHeaderStyle(ws,numCols){
  for(let c=0;c<numCols;c++){
    const ref=XLSX.utils.encode_cell({r:0,c});
    if(!ws[ref])continue;
    ws[ref].s={fill:{fgColor:{rgb:'0A2540'}},font:{color:{rgb:'00D4FF'},bold:true,sz:11},alignment:{horizontal:'center',wrapText:true},border:{bottom:{style:'thin',color:{rgb:'00D4FF'}}}};
  }
}

/* Download a blank template the user fills in */
function downloadTemplate(){
  const wb=XLSX.utils.book_new();

  /* Instructions sheet */
  const instrRows=[
    ['CableTrack Pro — Excel Import Template'],[''],
    ['HOW TO USE THIS TEMPLATE:'],
    ['1. Fill in the Equipment sheet with all your equipment (panels, transformers, racks, etc.)'],
    ['2. Fill in the Cables sheet with all cable runs, referencing Equipment IDs from the Equipment sheet'],
    ['3. Save the file and import it into CableTrack Pro using the Import button'],
    ['4. After updating statuses in the app, export to save progress back to Excel'],[''],
    ['VALID STATUS VALUES (Cables sheet, column F):'],
    ['  • Scheduled   — Cable not yet pulled'],
    ['  • Pulled      — Cable is physically in tray / conduit'],
    ['  • Terminating — Conductors are being landed'],
    ['  • Tested      — QC insulation / continuity test complete'],[''],
    ['VALID EQUIPMENT TYPES (Equipment sheet, column C):'],
    ['  '+EQ_TYPES.join(', ')],[''],
    ['IMPORTANT: Do not rename the sheet tabs (Equipment, Cables). Column order must match exactly.'],
  ];
  const instrWS=XLSX.utils.aoa_to_sheet(instrRows);
  instrWS['!cols']=[{wch:80}];
  instrWS['A1'].s={font:{bold:true,sz:14,color:{rgb:'00D4FF'}}};
  XLSX.utils.book_append_sheet(wb,instrWS,'Instructions');

  /* Equipment sheet — headers + 3 example rows */
  const eqData=[
    EQ_COLS,
    ['EQ-001','MV Switchgear A','Switchgear','Room 101'],
    ['EQ-002','Transformer T1','Transformer','Room 102'],
    ['EQ-003','UPS System 1','UPS','Room 103'],
  ];
  const eqWS=XLSX.utils.aoa_to_sheet(eqData);
  applyHeaderStyle(eqWS,EQ_COLS.length);
  /* Style example rows in muted blue */
  for(let r=1;r<=3;r++){
    for(let c=0;c<EQ_COLS.length;c++){
      const ref=XLSX.utils.encode_cell({r,c});
      if(eqWS[ref])eqWS[ref].s={font:{color:{rgb:'94A3B8'},italic:true},fill:{fgColor:{rgb:'0F1A2A'}}};
    }
  }
  eqWS['!cols']=[{wch:14},{wch:24},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb,eqWS,'Equipment');

  /* Cables sheet — headers + 3 example rows */
  const cblData=[
    CBL_COLS,
    ['CBL-001','600V 4/0 AWG','EQ-001','EQ-002',45,'Tested'],
    ['CBL-002','CAT6A STP',   'EQ-002','EQ-003',30,'Pulled'],
    ['CBL-003','Fiber OM4',   'EQ-001','EQ-003',22,'Scheduled'],
  ];
  const cblWS=XLSX.utils.aoa_to_sheet(cblData);
  applyHeaderStyle(cblWS,CBL_COLS.length);
  for(let r=1;r<=3;r++){
    for(let c=0;c<CBL_COLS.length;c++){
      const ref=XLSX.utils.encode_cell({r,c});
      if(cblWS[ref])cblWS[ref].s={font:{color:{rgb:'94A3B8'},italic:true},fill:{fgColor:{rgb:'0F1A2A'}}};
    }
  }
  cblWS['!cols']=[{wch:12},{wch:18},{wch:18},{wch:18},{wch:10},{wch:14}];
  XLSX.utils.book_append_sheet(wb,cblWS,'Cables');

  XLSX.writeFile(wb,'CableTrack_Template.xlsx');
}

/* Export a project to Excel */
function exportProject(project){
  const {name,equipment,cables}=project;
  const wb=XLSX.utils.book_new();

  const eqRows=equipment.map(e=>[e.id,e.name,e.type,e.location]);
  const eqWS=XLSX.utils.aoa_to_sheet([EQ_COLS,...eqRows]);
  applyHeaderStyle(eqWS,EQ_COLS.length);
  eqWS['!cols']=[{wch:14},{wch:24},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb,eqWS,'Equipment');

  const statusColorMap={Scheduled:'4A5568',Pulled:'B7791F',Terminating:'C05621',Tested:'276749'};
  const cblRows=cables.map(c=>[c.tagId,c.cableType,c.from,c.to,c.length,c.status]);
  const cblWS=XLSX.utils.aoa_to_sheet([CBL_COLS,...cblRows]);
  applyHeaderStyle(cblWS,CBL_COLS.length);
  cables.forEach((c,i)=>{
    const ref=XLSX.utils.encode_cell({r:i+1,c:5});
    if(cblWS[ref])cblWS[ref].s={fill:{fgColor:{rgb:statusColorMap[c.status]||'888888'}},font:{color:{rgb:'FFFFFF'},bold:true},alignment:{horizontal:'center'}};
  });
  cblWS['!cols']=[{wch:12},{wch:18},{wch:18},{wch:18},{wch:10},{wch:14}];
  XLSX.utils.book_append_sheet(wb,cblWS,'Cables');

  const n=cables.length||1,cnt=s=>cables.filter(c=>c.status===s).length;
  const sumRows=[
    ['Project Name',name],['Export Date',new Date().toLocaleDateString()],[''],
    ['METRIC','COUNT','%'],
    ['Total Cables',cables.length,'100%'],
    ['Scheduled',   cnt('Scheduled'),   pct(cnt('Scheduled'),n)],
    ['Pulled',      cnt('Pulled'),      pct(cnt('Pulled'),n)],
    ['Terminating', cnt('Terminating'), pct(cnt('Terminating'),n)],
    ['Tested',      cnt('Tested'),      pct(cnt('Tested'),n)],[''],
    ['CUMULATIVE PROGRESS'],
    ['Pulled or beyond', cnt('Pulled')+cnt('Terminating')+cnt('Tested'), pct(cnt('Pulled')+cnt('Terminating')+cnt('Tested'),n)],
    ['Terminated or beyond',cnt('Terminating')+cnt('Tested'),            pct(cnt('Terminating')+cnt('Tested'),n)],
    ['Fully Tested', cnt('Tested'),                                      pct(cnt('Tested'),n)],
  ];
  const sumWS=XLSX.utils.aoa_to_sheet(sumRows);
  sumWS['!cols']=[{wch:22},{wch:14},{wch:10}];
  XLSX.utils.book_append_sheet(wb,sumWS,'Summary');

  XLSX.writeFile(wb,`CableTrack_${name.replace(/[^a-zA-Z0-9_-]/g,'_')}.xlsx`);
}

/* Parse an imported Excel file */
function parseExcel(file,onSuccess,onError){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const eqSheet=wb.Sheets['Equipment'];
      if(!eqSheet)throw new Error('Missing "Equipment" sheet. Please use the CableTrack template.');
      const eqRaw=XLSX.utils.sheet_to_json(eqSheet,{header:1,defval:''});
      const equipment=[];
      for(let i=1;i<eqRaw.length;i++){
        const [id,name,type,location]=eqRaw[i];
        if(!String(id).trim())continue;
        equipment.push({id:String(id).trim(),name:String(name||'').trim(),type:String(type||'').trim(),location:String(location||'').trim()});
      }
      const cblSheet=wb.Sheets['Cables'];
      if(!cblSheet)throw new Error('Missing "Cables" sheet. Please use the CableTrack template.');
      const cblRaw=XLSX.utils.sheet_to_json(cblSheet,{header:1,defval:''});
      const cables=[];
      for(let i=1;i<cblRaw.length;i++){
        const [tagId,cableType,from,to,length,status]=cblRaw[i];
        if(!String(tagId).trim())continue;
        const safeStatus=STATUS_ORDER.includes(String(status))?String(status):'Scheduled';
        cables.push({id:String(tagId).trim(),tagId:String(tagId).trim(),cableType:String(cableType||'').trim(),from:String(from||'').trim(),to:String(to||'').trim(),length:parseFloat(length)||0,status:safeStatus});
      }
      if(equipment.length===0)throw new Error('No equipment rows found. Check the Equipment sheet has data below the header row.');
      onSuccess(equipment,cables);
    }catch(err){onError(err.message);}
  };
  reader.readAsArrayBuffer(file);
}

/* ══════════ Tiny shared UI ══════════ */
function Badge({status}){
  const m=STATUS_META[status]||STATUS_META.Scheduled;
  return <span style={{display:'inline-block',background:m.bg,color:m.text,fontFamily:'var(--font-mono)',fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:3,letterSpacing:1}}>{m.badge}</span>;
}

function Btn({children,onClick,variant='ghost',style={}}){
  const base={border:'none',borderRadius:6,padding:'7px 16px',fontFamily:'var(--font-head)',fontWeight:700,fontSize:12,letterSpacing:1,cursor:'pointer',transition:'opacity .15s',...style};
  const variants={
    primary:{background:'var(--acc)',color:'#000'},
    success:{background:'var(--test-bg)',color:'var(--test-t)',border:'1px solid #4ade80'},
    danger: {background:'var(--danger-bg)',color:'var(--danger)',border:'1px solid var(--danger)'},
    ghost:  {background:'var(--bg3)',color:'var(--text1)',border:'1px solid var(--border2)'},
    outline:{background:'transparent',color:'var(--acc)',border:'1px solid var(--acc)'},
  };
  return <button style={{...base,...variants[variant],...style}} onClick={onClick}>{children}</button>;
}

function MiniBar({cables}){
  const n=cables.length;
  if(!n)return <div style={{height:4,background:'var(--border)',borderRadius:2}}/>;
  const segs=STATUS_ORDER.map(s=>({s,pct:cables.filter(c=>c.status===s).length/n*100}));
  return(
    <div style={{display:'flex',height:5,borderRadius:3,overflow:'hidden',gap:1}}>
      {segs.map(({s,pct})=>pct>0&&<div key={s} style={{flex:pct,background:STATUS_META[s].dot,minWidth:2}}/>)}
    </div>
  );
}

function Toast({msg,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2800);return()=>clearTimeout(t);},[]);
  return <div className="toast">{msg}</div>;
}

/* ══════════ CANVAS ══════════ */
function Canvas({equipment,cables,selectedEq,selectedCable,onSelectEq,onSelectCable,onOpenDetail}){
  const svgRef=useRef(null);
  const [pan,setPan]=useState({x:20,y:20});
  const [zoom,setZoom]=useState(1);
  const [drag,setDrag]=useState(null);
  const [pos,setPos]=useState(()=>{
    const p={};
    equipment.forEach((e,i)=>{
      const grid={x:80+(i%3)*220,y:80+Math.floor(i/3)*200};
      p[e.id]=grid;
    });
    return p;
  });

  useEffect(()=>{
    setPos(prev=>{
      let changed=false;const p={...prev};
      equipment.forEach((e,i)=>{
        if(!p[e.id]){p[e.id]={x:80+(i%3)*220,y:80+Math.floor(i/3)*200};changed=true;}
      });
      return changed?p:prev;
    });
  },[equipment]);

  const onWheel=useCallback(e=>{
    e.preventDefault();
    const r=svgRef.current.getBoundingClientRect();
    const mx=e.clientX-r.left,my=e.clientY-r.top;
    const f=e.deltaY>0?.9:1.1,nz=Math.max(.3,Math.min(3,zoom*f));
    setPan(p=>({x:mx-(mx-p.x)*nz/zoom,y:my-(my-p.y)*nz/zoom}));
    setZoom(nz);
  },[zoom]);

  const onNodeDown=useCallback((e,id)=>{
    e.stopPropagation();
    const r=svgRef.current.getBoundingClientRect();
    setDrag({id,sx:e.clientX-r.left,sy:e.clientY-r.top,ox:pos[id].x,oy:pos[id].y});
  },[pos]);

  const onMove=useCallback(e=>{
    if(!drag)return;
    const r=svgRef.current.getBoundingClientRect();
    setPos(p=>({...p,[drag.id]:{x:drag.ox+(e.clientX-r.left-drag.sx)/zoom,y:drag.oy+(e.clientY-r.top-drag.sy)/zoom}}));
  },[drag,zoom]);

  const connected=useMemo(()=>{
    if(!selectedEq)return new Set();
    return new Set(cables.filter(c=>c.from===selectedEq||c.to===selectedEq).map(c=>c.id));
  },[selectedEq,cables]);

  const pOut=id=>{const p=pos[id];if(!p)return{x:0,y:0};return{x:p.x*zoom+pan.x+CARD_W*zoom,y:p.y*zoom+pan.y+CARD_H*zoom*.5};};
  const pIn =id=>{const p=pos[id];if(!p)return{x:0,y:0};return{x:p.x*zoom+pan.x,y:p.y*zoom+pan.y+CARD_H*zoom*.5};};
  const curve=(fid,tid)=>{const a=pOut(fid),b=pIn(tid),mx=(a.x+b.x)/2;return`M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`;};
  const MID={Scheduled:'ms',Pulled:'mp',Terminating:'mt',Tested:'md'};

  return(
    <svg ref={svgRef} width="100%" height="100%"
      onWheel={onWheel} onMouseMove={onMove}
      onMouseUp={()=>setDrag(null)} onMouseLeave={()=>setDrag(null)}
      onClick={()=>{onSelectEq(null);onSelectCable(null);}}
      style={{cursor:drag?'grabbing':'default',display:'block'}}>
      <defs>
        {Object.entries(STATUS_META).map(([s,m])=>(
          <marker key={s} id={MID[s]} markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M0,.5 L6,3.5 L0,6.5 Z" fill={m.dot}/>
          </marker>
        ))}
        <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <pattern id="grid" width={24*zoom} height={24*zoom} patternUnits="userSpaceOnUse" x={pan.x%(24*zoom)} y={pan.y%(24*zoom)}>
          <path d={`M${24*zoom} 0 L0 0 0 ${24*zoom}`} fill="none" stroke="#1a2030" strokeWidth="1"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>
      {cables.map(c=>{
        if(!pos[c.from]||!pos[c.to])return null;
        const m=STATUS_META[c.status]||STATUS_META.Scheduled;
        const sel=c.id===selectedCable,conn=connected.has(c.id),dim=selectedEq&&!conn;
        return(
          <g key={c.id} style={{cursor:'pointer'}} onClick={e=>{e.stopPropagation();const n=c.id===selectedCable?null:c.id;onSelectCable(n);if(n)onOpenDetail(c);}}>
            <path d={curve(c.from,c.to)} fill="none" stroke="transparent" strokeWidth={16}/>
            <path d={curve(c.from,c.to)} fill="none" stroke={m.dot} strokeWidth={sel?3.5:2}
              strokeDasharray={c.status==='Scheduled'?`${8*zoom},${5*zoom}`:undefined}
              opacity={dim?.08:sel?1:conn?.9:.55}
              markerEnd={`url(#${MID[c.status]})`} filter={sel?'url(#glow)':undefined}/>
          </g>
        );
      })}
      {equipment.map(eq=>{
        if(!pos[eq.id])return null;
        const p=pos[eq.id],x=p.x*zoom+pan.x,y=p.y*zoom+pan.y,w=CARD_W*zoom,h=CARD_H*zoom;
        const sel=eq.id===selectedEq,dim=selectedEq&&!sel;
        return(
          <g key={eq.id} onClick={e=>{e.stopPropagation();onSelectEq(sel?null:eq.id);onSelectCable(null);}}
             onMouseDown={e=>onNodeDown(e,eq.id)} style={{cursor:'grab',opacity:dim?.2:1}}>
            {sel&&<rect x={x-3} y={y-3} width={w+6} height={h+6} rx={10} fill="none" stroke="var(--acc)" strokeWidth={1.5} opacity={.8} style={{animation:'pulse 1.6s ease-in-out infinite'}}/>}
            <rect x={x} y={y} width={w} height={h} rx={8} fill={EQ_COLOR[eq.type]||'#141820'} stroke={sel?'var(--acc)':'var(--border2)'} strokeWidth={sel?1.5:1}/>
            <rect x={x+1} y={y+1} width={w-2} height={3} rx={2} fill={sel?'var(--acc)':'var(--border2)'} opacity={.8}/>
            <text x={x+10} y={y+h*.32} fill="var(--text2)" fontSize={Math.max(8,9*zoom)} fontFamily="var(--font-mono)" dominantBaseline="central">{eq.id}</text>
            <text x={x+w/2} y={y+h*.65} fill={sel?'#00d4ff':'var(--text0)'} fontSize={Math.min(12,10*zoom)} fontFamily="var(--font-head)" fontWeight={600} textAnchor="middle" dominantBaseline="central">
              {eq.name.length>16?eq.name.slice(0,15)+'…':eq.name}
            </text>
            <text x={x+w-10} y={y+h*.32} fill="var(--text2)" fontSize={Math.min(16,13*zoom)} textAnchor="end" dominantBaseline="central">{EQ_ICON[eq.type]||'◈'}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ══════════ DETAIL PANEL ══════════ */
function DetailPanel({cable,equipment,cables,onAdvance}){
  if(!cable)return(
    <div style={{padding:24,textAlign:'center',color:'var(--text2)'}}>
      <div style={{fontSize:32,marginBottom:8,opacity:.3}}>◈</div>
      <div style={{fontFamily:'var(--font-head)',fontSize:14,letterSpacing:2}}>SELECT A CABLE</div>
      <div style={{fontSize:11,marginTop:4}}>Click a line on the canvas or a row in the schedule</div>
    </div>
  );
  const live=cables.find(c=>c.id===cable.id)||cable;
  const fromEq=equipment.find(e=>e.id===live.from);
  const toEq=equipment.find(e=>e.id===live.to);
  const curIdx=STATUS_ORDER.indexOf(live.status);
  const nextS=STATUS_ORDER[curIdx+1];
  return(
    <div style={{padding:14}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
        <div style={{fontFamily:'var(--font-head)',fontSize:22,fontWeight:700,color:'var(--acc)'}}>{live.tagId}</div>
        <Badge status={live.status}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7,marginBottom:14}}>
        {[['Cable Type',live.cableType],['Length',live.length+' m'],['From',fromEq?.name||live.from],['To',toEq?.name||live.to],['From Room',fromEq?.location||'—'],['To Room',toEq?.location||'—']].map(([l,v])=>(
          <div key={l} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:6,padding:'7px 10px'}}>
            <div style={{color:'var(--text2)',fontSize:10,letterSpacing:1,marginBottom:2}}>{l}</div>
            <div style={{color:'var(--text0)',fontSize:12,fontWeight:500}}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{marginBottom:14}}>

              <React.Fragment key={s}>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                  <div style={{width:30,height:30,borderRadius:15,border:`2px solid ${done?m.dot:'var(--border2)'}`,
                    background:cur?m.bg:done?m.bg+'55':'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:12,color:done?m.text:'var(--text2)',boxShadow:cur?`0 0 10px ${m.dot}88`:'none'}}>
                    {done?'✓':'○'}
                  </div>
                  <div style={{color:done?m.dot:'var(--text2)',fontSize:9,letterSpacing:.5}}>{m.badge}</div>
                </div>
                {i<STATUS_ORDER.length-1&&<div style={{flex:1,height:2,background:curIdx>i?m.dot:'var(--border)',margin:'0 4px',marginBottom:17}}/>}
              </React.Fragment>
            );
          })}
        </div>
      </div>
      {nextS?(
        <button onClick={()=>onAdvance(live.id)} style={{width:'100%',padding:'10px',background:STATUS_META[nextS].bg,color:STATUS_META[nextS].text,border:`1px solid ${STATUS_META[nextS].dot}`,borderRadius:6,fontFamily:'var(--font-head)',fontWeight:700,fontSize:14,letterSpacing:2,cursor:'pointer'}}>

        </div>
      )}
    </div>
  );
}

/* ══════════ IMPORT MODAL ══════════ */
function ImportModal({onImport,onClose}){
  const [error,setError]=useState('');
  const [dragging,setDragging]=useState(false);
  const fileRef=useRef();
  const handle=file=>{
    if(!file)return;
    if(!file.name.match(/\.xlsx?$/i)){setError('Please select an Excel file (.xlsx)');return;}
    parseExcel(file,(eq,cables)=>onImport(eq,cables,file.name.replace(/\.[^.]+$/,'')),msg=>setError(msg));
  };
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div style={{fontFamily:'var(--font-head)',fontSize:22,fontWeight:700,color:'var(--acc)',letterSpacing:2,marginBottom:4}}>IMPORT FROM EXCEL</div>
        <div style={{color:'var(--text2)',fontSize:11,marginBottom:18}}>Load equipment and cables from a CableTrack Excel file</div>

        <div onClick={()=>fileRef.current.click()}
          onDragOver={e=>{e.preventDefault();setDragging(true);}}
          onDragLeave={()=>setDragging(false)}
          onDrop={e=>{e.preventDefault();setDragging(false);handle(e.dataTransfer.files[0]);}}
          style={{border:`2px dashed ${dragging?'var(--acc)':'var(--border2)'}`,borderRadius:8,padding:'28px 20px',textAlign:'center',cursor:'pointer',background:dragging?'var(--bg3)':'var(--bg0)',marginBottom:14,transition:'all .15s'}}>
          <div style={{fontSize:28,marginBottom:8}}>📂</div>
          <div style={{color:'var(--text1)',fontFamily:'var(--font-head)',fontSize:14,letterSpacing:1}}>DRAG &amp; DROP EXCEL FILE</div>
          <div style={{color:'var(--text2)',fontSize:11,marginTop:4}}>or click to browse — .xlsx files only</div>
          <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={e=>handle(e.target.files[0])}/>
        </div>

        {error&&<div style={{color:'#f87171',fontSize:11,marginBottom:12,padding:'8px 10px',background:'var(--danger-bg)',borderRadius:5}}>⚠ {error}</div>}

        <div style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:6,padding:'10px 12px',marginBottom:16}}>
          <div style={{color:'var(--text2)',fontSize:10,letterSpacing:1,marginBottom:6}}>REQUIRED SHEET STRUCTURE</div>
          <div style={{fontSize:11,color:'var(--text1)',lineHeight:1.7}}>
            <div>📋 <strong style={{color:'var(--acc)'}}>Equipment</strong> — {EQ_COLS.join(' · ')}</div>
            <div>🔌 <strong style={{color:'var(--acc)'}}>Cables</strong> — {CBL_COLS.join(' · ')}</div>
          </div>
        </div>

        <div style={{display:'flex',gap:8,justifyContent:'space-between',alignItems:'center'}}>
          <button onClick={downloadTemplate} style={{background:'transparent',border:'1px solid var(--border2)',borderRadius:6,padding:'7px 14px',color:'var(--text2)',fontFamily:'var(--font-head)',fontSize:11,letterSpacing:1,cursor:'pointer'}}>
            ⬇ DOWNLOAD TEMPLATE
          </button>
          <Btn onClick={onClose}>CLOSE</Btn>
        </div>
      </div>
    </div>
  );
}

/* ══════════ PROJECT EDITOR ══════════ */
function ProjectEditor({project,onBack,onSave,showToast}){
  const [data,setData]=useState(project);
  const [editingName,setEditingName]=useState(false);
  const [selectedEq,setSelectedEq]=useState(null);
  const [selectedCable,setSelectedCable]=useState(null);
  const [detailCable,setDetailCable]=useState(null);
  const [filterStatus,setFilterStatus]=useState('All');
  const [activeTab,setActiveTab]=useState('schedule');
  const [showAddCable,setShowAddCable]=useState(false);
  const [showAddEq,setShowAddEq]=useState(false);
  const [showImport,setShowImport]=useState(false);
  const [form,setForm]=useState({tagId:'',from:'',to:'',cableType:'',length:''});
  const [eqForm,setEqForm]=useState({id:'',name:'',type:'Switchgear',location:''});

  /* Auto-save to parent */
  useEffect(()=>{onSave({...data,updatedAt:new Date().toISOString()});},[data]);

  const advanceCable=useCallback(id=>{
    setData(d=>({...d,cables:d.cables.map(c=>{
      if(c.id!==id)return c;
      const i=STATUS_ORDER.indexOf(c.status);
      return i<STATUS_ORDER.length-1?{...c,status:STATUS_ORDER[i+1]}:c;
    })}));
  },[]);

  const addCable=()=>{
    if(!form.tagId||!form.from||!form.to){showToast('Tag ID, From, and To are required.');return;}
    if(data.cables.find(c=>c.id===form.tagId)){showToast('A cable with that Tag ID already exists.');return;}
    setData(d=>({...d,cables:[...d.cables,{id:form.tagId,tagId:form.tagId,cableType:form.cableType||'TBD',from:form.from,to:form.to,length:parseFloat(form.length)||0,status:'Scheduled'}]}));
    setForm({tagId:'',from:'',to:'',cableType:'',length:''});
    setShowAddCable(false);
    showToast(`Cable ${form.tagId} added`);
  };

  const addEquipment=()=>{
    if(!eqForm.id||!eqForm.name){showToast('Equipment ID and Name are required.');return;}
    if(data.equipment.find(e=>e.id===eqForm.id)){showToast('Equipment ID already exists.');return;}
    setData(d=>({...d,equipment:[...d.equipment,{...eqForm}]}));
    setEqForm({id:'',name:'',type:'Switchgear',location:''});
    setShowAddEq(false);
    showToast(`Equipment ${eqForm.id} added`);
  };

  const importIntoProject=(eq,cables)=>{
    setData(d=>({...d,equipment:eq,cables}));
    setShowImport(false);
    showToast(`Imported ${eq.length} equipment, ${cables.length} cables into project`);
  };

  const kpi=useMemo(()=>{
    const n=data.cables.length;
    if(!n)return{total:0,pPulled:0,pTerm:0,pTest:0};
    const cnt=s=>data.cables.filter(c=>c.status===s).length;
    return{total:n,pPulled:Math.round((cnt('Pulled')+cnt('Terminating')+cnt('Tested'))/n*100),pTerm:Math.round((cnt('Terminating')+cnt('Tested'))/n*100),pTest:Math.round(cnt('Tested')/n*100)};
  },[data.cables]);

  const filtered=useMemo(()=>filterStatus==='All'?data.cables:data.cables.filter(c=>c.status===filterStatus),[data.cables,filterStatus]);
  const getEqName=id=>data.equipment.find(e=>e.id===id)?.name||id;
  const inp={background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:5,padding:'5px 8px',color:'var(--text0)',fontFamily:'var(--font-mono)',fontSize:11,width:'100%'};

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'0 12px',height:46,background:'var(--bg1)',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <button onClick={onBack} style={{background:'transparent',border:'none',color:'var(--text2)',cursor:'pointer',fontSize:18,padding:'2px 6px',borderRadius:4}} title="Back to projects">←</button>
        <span style={{color:'var(--border2)',fontSize:16}}>|</span>
        <span style={{fontFamily:'var(--font-head)',fontSize:16,fontWeight:700,color:'var(--acc)',letterSpacing:2}}>⚡</span>
        {editingName?(
          <input value={data.name} autoFocus
            onChange={e=>setData(d=>({...d,name:e.target.value}))}
            onBlur={()=>setEditingName(false)}
            onKeyDown={e=>{if(e.key==='Enter')setEditingName(false);}}
            style={{...inp,fontSize:13,width:220}}/>
        ):(
          <div onClick={()=>setEditingName(true)} style={{color:'var(--text1)',fontFamily:'var(--font-head)',fontSize:14,fontWeight:600,cursor:'text',padding:'2px 6px',borderRadius:4,border:'1px solid transparent',maxWidth:240,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title="Click to rename">
            {data.name} <span style={{color:'var(--text2)',fontSize:10}}>✎</span>
          </div>
        )}
        {data.site&&<span style={{color:'var(--text2)',fontSize:11}}>· {data.site}</span>}
        <div style={{flex:1}}/>
        <span style={{color:'var(--text2)',fontSize:11}}>{data.equipment.length} EQ · {data.cables.length} CBL</span>
        <button onClick={()=>setShowAddEq(s=>!s)} style={{background:showAddEq?'var(--acc)':'var(--bg3)',color:showAddEq?'#000':'var(--text1)',border:'1px solid var(--border2)',borderRadius:5,padding:'4px 12px',fontFamily:'var(--font-head)',fontSize:11,letterSpacing:1,cursor:'pointer'}}>
          {showAddEq?'✕':'＋ EQUIPMENT'}
        </button>
        <button onClick={()=>setShowAddCable(s=>!s)} style={{background:showAddCable?'var(--acc)':'transparent',color:showAddCable?'#000':'var(--acc)',border:'1px solid var(--acc)',borderRadius:5,padding:'4px 12px',fontFamily:'var(--font-head)',fontSize:11,letterSpacing:1,cursor:'pointer'}}>
          {showAddCable?'✕':'＋ CABLE'}
        </button>
        <button onClick={()=>setShowImport(true)} style={{background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:5,padding:'4px 12px',color:'var(--text1)',fontFamily:'var(--font-head)',fontSize:11,letterSpacing:1,cursor:'pointer'}}>📂 IMPORT</button>
        <button onClick={()=>{exportProject(data);showToast('Excel exported');}} style={{background:'var(--test-bg)',border:'1px solid #4ade80',borderRadius:5,padding:'4px 12px',color:'var(--test-t)',fontFamily:'var(--font-head)',fontSize:11,letterSpacing:1,cursor:'pointer'}}>⬆ EXPORT</button>
      </div>

      {/* Add equipment inline bar */}
      {showAddEq&&(
        <div style={{display:'flex',gap:8,alignItems:'flex-end',flexWrap:'wrap',padding:'8px 12px',background:'var(--bg2)',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          {[['EQ ID','id','e.g. EQ-007'],['NAME','name','e.g. ATS Panel 1'],['LOCATION','location','e.g. Room 107']].map(([l,k,ph])=>(
            <div key={k} style={{display:'flex',flexDirection:'column',gap:3,minWidth:120}}>
              <label style={{color:'var(--text2)',fontSize:10,letterSpacing:1}}>{l}</label>
              <input style={inp} placeholder={ph} value={eqForm[k]} onChange={e=>setEqForm(p=>({...p,[k]:e.target.value}))}/>
            </div>
          ))}
          <div style={{display:'flex',flexDirection:'column',gap:3,minWidth:130}}>
            <label style={{color:'var(--text2)',fontSize:10,letterSpacing:1}}>TYPE</label>
            <select style={{...inp,cursor:'pointer'}} value={eqForm.type} onChange={e=>setEqForm(p=>({...p,type:e.target.value}))}>
              {EQ_TYPES.map(t=><option key={t}>{t}</option>)}
            </select>
          </div>
          <button onClick={addEquipment} style={{background:'#1e3a5f',color:'var(--acc)',border:'1px solid var(--acc)',borderRadius:5,padding:'5px 16px',fontFamily:'var(--font-head)',fontWeight:700,fontSize:11,letterSpacing:1,cursor:'pointer',alignSelf:'flex-end'}}>COMMIT</button>
        </div>
      )}

      {/* Add cable inline bar */}
      {showAddCable&&(
        <div style={{display:'flex',gap:8,alignItems:'flex-end',flexWrap:'wrap',padding:'8px 12px',background:'var(--bg2)',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          {[['TAG ID','tagId','e.g. CBL-013'],['CABLE TYPE','cableType','e.g. 600V 4/0 AWG'],['LENGTH (m)','length','0']].map(([l,k,ph])=>(
            <div key={k} style={{display:'flex',flexDirection:'column',gap:3,minWidth:110}}>
              <label style={{color:'var(--text2)',fontSize:10,letterSpacing:1}}>{l}</label>
              <input style={inp} placeholder={ph} value={form[k]} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))}/>
            </div>
          ))}
          {['from','to'].map(f=>(
            <div key={f} style={{display:'flex',flexDirection:'column',gap:3,minWidth:140}}>
              <label style={{color:'var(--text2)',fontSize:10,letterSpacing:1}}>{f==='from'?'FROM EQUIP':'TO EQUIP'}</label>
              <select style={{...inp,cursor:'pointer'}} value={form[f]} onChange={e=>setForm(p=>({...p,[f]:e.target.value}))}>
                <option value="">— Select —</option>
                {data.equipment.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
              </select>
            </div>
          ))}
          <button onClick={addCable} style={{background:'var(--test-bg)',color:'var(--test-t)',border:'1px solid #4ade80',borderRadius:5,padding:'5px 16px',fontFamily:'var(--font-head)',fontWeight:700,fontSize:11,letterSpacing:1,cursor:'pointer',alignSelf:'flex-end'}}>COMMIT</button>
        </div>
      )}

      {/* Main body */}
      <div style={{display:'flex',flex:1,overflow:'hidden'}}>
        {/* Canvas */}
        <div style={{flex:'0 0 54%',position:'relative',borderRight:'1px solid var(--border)',background:'var(--bg1)',overflow:'hidden'}}>
          <div style={{position:'absolute',top:8,left:10,zIndex:10,color:'var(--text2)',fontSize:10,letterSpacing:1,pointerEvents:'none'}}>
            NODAL CANVAS · DRAG NODES · SCROLL TO ZOOM
          </div>
          {data.equipment.length===0?(
            <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:10,color:'var(--text2)'}}>
              <div style={{fontSize:40,opacity:.1}}>⚡</div>
              <div style={{fontFamily:'var(--font-head)',fontSize:14,letterSpacing:2}}>NO EQUIPMENT YET</div>
              <div style={{fontSize:11}}>Add equipment above or import from Excel</div>
            </div>
          ):(
            <Canvas equipment={data.equipment} cables={data.cables} selectedEq={selectedEq} selectedCable={selectedCable}
              onSelectEq={setSelectedEq} onSelectCable={setSelectedCable}
              onOpenDetail={c=>{setDetailCable(c);setActiveTab('detail');}}/>
          )}
          <div style={{position:'absolute',bottom:10,left:10,display:'flex',gap:12,background:'rgba(10,12,15,.88)',border:'1px solid var(--border)',borderRadius:6,padding:'5px 12px',pointerEvents:'none'}}>
            {STATUS_ORDER.map(s=>(
              <div key={s} style={{display:'flex',alignItems:'center',gap:5,fontSize:10,color:'var(--text2)'}}>
                <div style={{width:18,height:2,background:STATUS_META[s].dot,borderRadius:1}}/>{s}
              </div>
            ))}
          </div>
        </div>

        {/* Dashboard */}
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',background:'var(--bg1)'}}>
          {/* KPIs */}
          <div style={{display:'flex',gap:8,padding:'10px 12px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
            {[['Total Cables',kpi.total,'in schedule',null],['% Pulled',kpi.pPulled+'%','in conduit','var(--pull-t)'],['% Terminated',kpi.pTerm+'%','conductors landed','var(--term-t)'],['% Tested',kpi.pTest+'%','QC complete','var(--test-t)']].map(([l,v,s,c])=>(
              <div key={l} style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'10px 14px',flex:1}}>
                <div style={{color:'var(--text2)',fontFamily:'var(--font-head)',fontSize:10,letterSpacing:2,textTransform:'uppercase',marginBottom:3}}>{l}</div>
                <div style={{fontFamily:'var(--font-head)',fontSize:26,fontWeight:700,color:c||'var(--text0)',lineHeight:1.1}}>{v}</div>
                <div style={{color:'var(--text2)',fontSize:10,marginTop:2}}>{s}</div>
              </div>
            ))}
          </div>

          {/* Tabs */}
          <div style={{display:'flex',borderBottom:'1px solid var(--border)',flexShrink:0,alignItems:'center'}}>
            {['schedule','detail'].map(t=>(
              <button key={t} onClick={()=>setActiveTab(t)} style={{padding:'7px 16px',background:'transparent',border:'none',borderBottom:`2px solid ${activeTab===t?'var(--acc)':'transparent'}`,color:activeTab===t?'var(--acc)':'var(--text2)',fontFamily:'var(--font-head)',fontWeight:600,fontSize:12,letterSpacing:1,cursor:'pointer',textTransform:'uppercase'}}>
                {t==='schedule'?'Cable Schedule':detailCable?`Detail: ${detailCable.tagId}`:'Cable Detail'}
              </button>
            ))}
            <div style={{flex:1}}/>
            <div style={{display:'flex',gap:4,padding:'0 10px'}}>
              {['All',...STATUS_ORDER].map(s=>(
                <button key={s} onClick={()=>setFilterStatus(s)} style={{padding:'2px 8px',borderRadius:4,cursor:'pointer',border:`1px solid ${filterStatus===s?(STATUS_META[s]?.dot||'var(--acc)'):'var(--border)'}`,background:filterStatus===s?'var(--bg3)':'transparent',color:filterStatus===s?(STATUS_META[s]?.dot||'var(--acc)'):'var(--text2)',fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:.5}}>
                  {s==='All'?'ALL':STATUS_META[s].badge}
                </button>
              ))}
            </div>
          </div>

          <div style={{flex:1,overflow:'auto'}}>
            {activeTab==='schedule'&&(
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
                <thead>
                  <tr style={{position:'sticky',top:0,background:'var(--bg2)',zIndex:5}}>
                    {['Tag ID','From','To','Type','Len','Status','Action'].map(h=>(
                      <th key={h} style={{padding:'7px 8px',color:'var(--text2)',fontFamily:'var(--font-head)',letterSpacing:1,fontSize:10,textAlign:'left',borderBottom:'1px solid var(--border)',fontWeight:600,whiteSpace:'nowrap'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filtered.length===0&&<tr><td colSpan={7} style={{padding:24,color:'var(--text2)',textAlign:'center'}}>No cables match this filter</td></tr>}
                  {filtered.map((cable,i)=>{
                    const sel=cable.id===selectedCable,nextS=STATUS_ORDER[STATUS_ORDER.indexOf(cable.status)+1];
                    return(
                      <tr key={cable.id} onClick={()=>{setSelectedCable(sel?null:cable.id);if(!sel){setDetailCable(cable);setActiveTab('detail');}}} style={{background:sel?'var(--bg3)':i%2?'var(--bg1)':'transparent',cursor:'pointer',borderBottom:'1px solid var(--border)'}}>
                        <td style={{padding:'6px 8px',color:'var(--acc)',fontWeight:700}}>{cable.tagId}</td>
                        <td style={{padding:'6px 8px',color:'var(--text1)',maxWidth:80,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{getEqName(cable.from)}</td>
                        <td style={{padding:'6px 8px',color:'var(--text1)',maxWidth:80,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{getEqName(cable.to)}</td>
                        <td style={{padding:'6px 8px',color:'var(--text2)',whiteSpace:'nowrap'}}>{cable.cableType}</td>
                        <td style={{padding:'6px 8px',color:'var(--text2)'}}>{cable.length}m</td>
                        <td style={{padding:'6px 8px'}}><Badge status={cable.status}/></td>
                        <td style={{padding:'6px 8px'}}>
                          {nextS?<button onClick={e=>{e.stopPropagation();advanceCable(cable.id);}} style={{background:'var(--bg4)',border:`1px solid ${STATUS_META[nextS].dot}`,borderRadius:4,color:STATUS_META[nextS].dot,padding:'2px 9px',fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:.5,cursor:'pointer',fontWeight:700}}>▶ {STATUS_META[nextS].badge}</button>:<span style={{color:'#4ade80',fontSize:10}}>✓ DONE</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
            {activeTab==='detail'&&<DetailPanel cable={detailCable} cables={data.cables} equipment={data.equipment} onAdvance={advanceCable}/>}
          </div>

          {selectedEq&&(()=>{
            const eq=data.equipment.find(e=>e.id===selectedEq);if(!eq)return null;
            const eqCables=data.cables.filter(c=>c.from===selectedEq||c.to===selectedEq);
            return(
              <div style={{borderTop:'1px solid var(--border)',padding:'6px 12px',background:'var(--bg2)',flexShrink:0,display:'flex',gap:14,alignItems:'center'}}>
                <div style={{color:'var(--acc)',fontFamily:'var(--font-head)',fontWeight:700,fontSize:12,letterSpacing:1}}>{eq.name}</div>
                <div style={{color:'var(--text2)',fontSize:11}}>{eq.type} · {eq.location}</div>
                <div style={{color:'var(--text2)',fontSize:11}}>{eqCables.length} cables</div>
                <div style={{flex:1}}/>
                {STATUS_ORDER.map(s=>{const cnt=eqCables.filter(c=>c.status===s).length;return cnt>0&&<span key={s} style={{background:STATUS_META[s].bg,color:STATUS_META[s].text,fontSize:9,padding:'1px 6px',borderRadius:3,fontWeight:700}}>{cnt} {STATUS_META[s].badge}</span>;})}
              </div>
            );
          })()}
        </div>
      </div>

      {showImport&&<ImportModal onImport={importIntoProject} onClose={()=>setShowImport(false)}/>}
    </div>
  );
}

/* ══════════ ROOT ══════════ */
function App(){
  const [projects,setProjects]=useState(loadProjects);
  const [openProject,setOpenProject]=useState(null);
  const [toasts,setToasts]=useState([]);

  const showToast=msg=>setToasts(t=>[...t,{id:Date.now(),msg}]);
  const removeToast=id=>setToasts(t=>t.filter(x=>x.id!==id));

  const saveProject=useCallback(updated=>{
    setProjects(prev=>{
      const next=prev.map(p=>p.id===updated.id?updated:p);
      saveProjects(next);
      return next;
    });
    if(openProject?.id===updated.id)setOpenProject(updated);
  },[openProject]);

  const handleOpen=proj=>{
    /* Always open the freshest version from state */
    const fresh=projects.find(p=>p.id===proj.id)||proj;
    setOpenProject(fresh);
  };

  return(
    <>
      {openProject
        ? <ProjectEditor project={openProject} onBack={()=>setOpenProject(null)} onSave={saveProject} showToast={showToast}/>
        : <ProjectHome onOpen={handleOpen} onDelete={id=>{setProjects(p=>{const n=p.filter(x=>x.id!==id);saveProjects(n);return n;});}} showToast={showToast}/>
      }
      <div className="toast-wrap">
        {toasts.map(t=><Toast key={t.id} msg={t.msg} onDone={()=>removeToast(t.id)}/>)}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
